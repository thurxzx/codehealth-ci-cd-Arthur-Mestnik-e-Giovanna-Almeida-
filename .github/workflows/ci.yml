name: CI Pipeline - CodeHealth

on:
  push:
    branches: [develop, feature/teste-ci]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: Etapa de Build (simulada)
      run: echo "🔧 Compilando aplicação CodeHealth..."

    - name: Etapa de Testes (simulada)
      run: |
        echo "🧪 Executando testes simulados..."
        echo "Teste concluído com sucesso!"

    - name: Relatório final
      run: echo "✅ Build successful!"
    - name: Deploy simulado
      if: success()
      run: |
        echo "🚀 Gerando artefato de deploy..."
        mkdir -p staging
        zip -r staging/codehealth.zip .
        echo "✅ Deploy concluído para ambiente de homologação!"
